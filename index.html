<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard App</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="app-container">

        <header class="app-header">
            <p class="task-label">TASK 28</p>
            <h1>Flashcard App</h1>
            <p>Click the card to reveal the answer</p>
        </header>

        <section class="flashcard-section">

            <div class="progress">
                <span id="progressText">Card 1 of 10</span>
                <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
</div>
            </div>

            <div class="flashcard-container" id="flashcard">
                <div class="flashcard">

                    <div class="card-face card-front">
                        <span class="card-label">QUESTION</span>
                        <h2 id="question">
                            What does HTML stand for?
                        </h2>
                        <p class="flip-hint">Click to flip</p>
                    </div>

                    <div class="card-face card-back">
                        <span class="card-label">ANSWER</span>
                        <h2 id="answer">
                            HyperText Markup Language
                        </h2>
                        <p class="flip-hint">Click to flip back</p>
                    </div>

                </div>
            </div>

            <div class="navigation">
                <button id="prevBtn" type="button">
                    ← Previous
                </button>

                <button id="nextBtn" type="button">
                    Next →
                </button>
            </div>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
